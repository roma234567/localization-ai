name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
      - name: Create ephemeral test signing key
        shell: bash
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/vinlagon-test-signing.jks"
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          keytool -genkeypair -v -keystore "$store" -storepass "$password" -keypass "$password" -alias vinlagon-test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Vinlagon Test Build, OU=QA, O=Vinlagon, C=US"
          {
            echo "VINLAGON_KEYSTORE=$store"
            echo "VINLAGON_STORE_PASSWORD=$password"
            echo "VINLAGON_KEY_ALIAS=vinlagon-test"
            echo "VINLAGON_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Unit tests and APKs
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease > gradle-build.log 2>&1
          result=$?
          tail -n 160 gradle-build.log
          {
            echo '### Gradle output (tail)'
            echo '```text'
            tail -n 160 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Surface Gradle diagnostics in check annotations
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path("gradle-build.log").read_text(errors="replace").splitlines()
          matches = [i for i, line in enumerate(lines) if any(term in line.lower() for term in ("what went wrong", "e: ", "error:", "unresolved reference", "compilation error"))]
          excerpts = []
          for i in matches[:8]:
              excerpts.extend(lines[max(0, i - 2):min(len(lines), i + 5)])
          part = "\\n".join(excerpts) if excerpts else "\\n".join(lines[-100:])
          escaped = part[:3500].replace("%", "%25").replace("\\r", "%0D").replace("\\n", "%0A")
          print(f"::error title=Gradle compiler diagnostics::{escaped}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vinlagonChat-build-output
          path: |
            app/build/outputs/apk/**/*.apk
            gradle-build.log
          if-no-files-found: warn
