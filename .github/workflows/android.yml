name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and APKs
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease > gradle-build.log 2>&1
          result=$?
          tail -n 160 gradle-build.log
          {
            echo '### Gradle output (tail)'
            echo '```text'
            tail -n 160 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Surface Gradle diagnostics in check annotations
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("gradle-build.log").read_text(errors="replace")
          for title, part in (("Gradle log start", text[:3500]), ("Gradle log end", text[-3500:])):
              escaped = part.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{escaped}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vinlagonChat-build-output
          path: |
            app/build/outputs/apk/**/*.apk
            gradle-build.log
          if-no-files-found: warn
